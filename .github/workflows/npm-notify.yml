name: NPM Notification

on:
  workflow_run:
    workflows: ["NPM Publish", "NPM Check", "NPM Registry Summary"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        run: |
          STATUS="${{ github.event.workflow_run.conclusion }}"
          WORKFLOW="${{ github.event.workflow_run.name }}"
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          
          # Format status icon
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
          elif [ "$STATUS" = "failure" ]; then
            ICON="❌"
          else
            ICON="⚠️"
          fi
          
          # Send to Telegram if secrets are present
          if [ -n "${{ secrets.TELEGRAM_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Sending Telegram notification..."
            TEXT="$ICON *Workflow completed: $WORKFLOW*%0A*Repo:* $REPO%0A*Status:* $STATUS%0A*Run Details:* [View Github Action Run](https://github.com/$REPO/actions/runs/$RUN_ID)"
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=$TEXT" \
              -d "parse_mode=Markdown"
          fi
          
          # Send to Discord if webhook secret is present
          if [ -n "${{ secrets.DISCORD_WEBHOOK }}" ]; then
            echo "Sending Discord notification..."
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\": \"$ICON **Workflow completed: $WORKFLOW**\n**Repo:** $REPO\n**Status:** $STATUS\n**Run Details:** https://github.com/$REPO/actions/runs/$RUN_ID\"}" \
              "${{ secrets.DISCORD_WEBHOOK }}"
          fi
